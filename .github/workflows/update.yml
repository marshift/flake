name: Update

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Lix
        uses: canidae-solutions/lix-quick-install-action@8ccd1622179c3881955a55d538670c43e4e22c06

      - name: Update packages
        run: |
          set -euo pipefail
          .github/update-helium.sh 2>&1 | tee -a /tmp/packages.log

      # I could use DeterminateSystems/update-flake-lock here but it'd just complicate things
      - name: Update flake inputs
        run: |
          set -euo pipefail
          nix flake update 2>&1 | tee /tmp/flake-inputs.log

      - name: Generate summary
        run: |
          {
            echo "## Packages"
            echo
            echo '```'
            cat /tmp/packages.log
            echo '```'
            echo
            echo "## Flake inputs"
            echo
            echo '```'
            cat /tmp/flake-inputs.log
            echo '```'
          } > /tmp/summary.md

      - name: Create pull request
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.UPDATE_GH_TOKEN }}
          branch: actions/update
          commit-message: "packages+flake: update"
          title: Update packages and flake inputs
          body-path: /tmp/summary.md

      - name: Wait for checks and merge
        env:
          GH_TOKEN: ${{ secrets.UPDATE_GH_TOKEN }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          sleep 30
          gh pr checks --watch --fail-fast "$PR"
          gh pr merge --squash --delete-branch --subject "packages+flake: update (#$PR)" "$PR"
